
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>1人管理用シフト生成アプリ v70‑rev</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;margin:1rem;background:#f5f9fb;line-height:1.5;}
h1{font-size:1.4rem;margin-bottom:.5rem;}
input,button,select,textarea{font-size:1rem;padding:.4rem .6rem;border:1px solid #ccc;border-radius:.5rem;}
button{background:#009999;color:#fff;cursor:pointer;}
button:disabled{background:#aaa;cursor:not-allowed;}
textarea{width:100%;height:6rem;margin-top:.3rem;}
table{border-collapse:collapse;margin-top:1rem;width:100%;}
th,td{border:1px solid #ccc;padding:.3rem;text-align:center;font-size:.9rem;}
thead{background:#e0f7f7;}
.flex{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;}
label{font-weight:bold;}
.section{background:#fff;border:1px solid #ddd;border-radius:.8rem;padding:1rem;margin-bottom:1rem;}
</style>
</head>
<body>
<h1>1人管理用シフト生成アプリ v70‑rev</h1>
<div class="section">
  <div class="flex">
    <label>開始日: <input type="date" id="startDate" value=""></label>
    <label>日数: <input type="number" id="days" value="31" min="1" max="62" style="width:5rem;"></label>
    <label>最大連勤日数:
      <select id="maxConsec">
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option>
      </select>
    </label>
    <button id="btnGenerate">自動生成</button>
  </div>
</div>

<div class="section">
  <h2>スタッフ CSV</h2>
  <p>列: name,employment_type,main_time,start_time,end_time,is_time_fixed,remarks</p>
  <textarea id="employeesCsv"></textarea>
</div>

<div class="section">
  <h2>必要人数 CSV</h2>
  <p>列: employment_type,headcount</p>
  <textarea id="reqCsv"></textarea>
</div>

<div class="section">
  <h2>結果</h2>
  <div id="result"></div>
</div>

<script>
// Employment types order
const EMP_TYPES = ["社員","バイト 早番","バイト 遅番","バイト フリー","バイト 学生"];

class Employee{
  constructor(obj){
    Object.assign(this,obj);
    this.totalMinutes=0;
    this.consecDays=0;
  }
  maxConsecutive(globalMax){
    const m=this.remarks.match(/(\d+)日連続/);
    return m?parseInt(m[1],10):globalMax;
  }
}

function parseCSV(text){
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const headers=lines[0].split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const cols=line.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(c=>c.trim());
    const obj={};
    headers.forEach((h,i)=>obj[h]=cols[i]||"");
    return obj;
  });
}

function schedule(employeesData,reqData,startDate,days,maxConsec){
  const employees=employeesData.map(d=>new Employee({
    name:d.name,
    employment_type:d.employment_type,
    main_time:d.main_time,
    start_time:d.start_time,
    end_time:d.end_time,
    is_time_fixed:d.is_time_fixed.toLowerCase().startsWith("t")||d.is_time_fixed==="1",
    remarks:d.remarks||""
  }));
  // Build req table map date->etype->count
  const reqTable={};
  for(let i=0;i<days;i++){
    const dateStr=formatDate(addDays(startDate,i));
    reqTable[dateStr]={};
    EMP_TYPES.forEach(et=>{
      const row=reqData.find(r=>r.employment_type===et);
      reqTable[dateStr][et]=row?parseInt(row.headcount,10):0;
    });
  }
  const scheduleMap={}; // key name+date => true
  const shiftMinutes=emp=>{
    const [sh,sm]=emp.start_time.split(':').map(Number);
    const [eh,em]=emp.end_time.split(':').map(Number);
    return (eh*60+em)-(sh*60+sm);
  };
  const needs=(etype,date)=>reqTable[date][etype]>0;
  const assign=(emp,date)=>{
    const key=emp.name+"@"+date;
    if(scheduleMap[key]) return;
    scheduleMap[key]=true;
    emp.totalMinutes+=shiftMinutes(emp);
    // update consec
    const prevKey=emp.name+"@"+formatDate(addDays(parseDate(date),-1));
    emp.consecDays = scheduleMap[prevKey]? emp.consecDays+1:1;
    reqTable[date][emp.employment_type]--;
  };
  const canWork=(emp,date)=>{
    const prevKey=emp.name+"@"+formatDate(addDays(parseDate(date),-1));
    const prevWorked=scheduleMap[prevKey]||false;
    const consec=prevWorked?emp.consecDays:0;
    return consec<emp.maxConsecutive(maxConsec);
  };

  // Phase 1: place fixed
  Object.values(employees.filter(e=>e.is_time_fixed)).forEach(emp=>{
    for(let i=0;i<days;i++){
      const date=formatDate(addDays(startDate,i));
      if(needs(emp.employment_type,date)){
        assign(emp,date);
      }
    }
  });
  // Phase 2: fill remaining
  for(let i=0;i<days;i++){
    const date=formatDate(addDays(startDate,i));
    for(const etype of EMP_TYPES){
      while(needs(etype,date)){
        const candidates=employees.filter(e=>e.employment_type===etype && !e.is_time_fixed && canWork(e,date));
        if(!candidates.length) break;
        candidates.sort((a,b)=>a.totalMinutes-b.totalMinutes);
        assign(candidates[0],date);
      }
    }
  }
  return scheduleMap;
}

function parseDate(str){ return new Date(str);}
function formatDate(d){ return d.toISOString().slice(0,10);}
function addDays(d,n){ const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt;}

function buildTable(scheduleMap,employees,startDate,days){
  const names=[...new Set(employees.map(e=>e.name))];
  let html='<table><thead><tr><th>日付</th>'+names.map(n=>'<th>'+n+'</th>').join('')+'</tr></thead><tbody>';
  for(let i=0;i<days;i++){
    const date=formatDate(addDays(startDate,i));
    html+='<tr><td>'+date+'</td>';
    for(const n of names){
      html+='<td>'+ (scheduleMap[n+"@"+date]?"◯":"") +'</td>';
    }
    html+='</tr>';
  }
  html+='</tbody></table>';
  return html;
}

document.getElementById('btnGenerate').addEventListener('click',()=>{
  const empText=document.getElementById('employeesCsv').value;
  const reqText=document.getElementById('reqCsv').value;
  if(!empText.trim()||!reqText.trim()) return alert('CSV を入力してください');
  const employees=parseCSV(empText);
  const req=parseCSV(reqText);
  const startDate=parseDate(document.getElementById('startDate').value||new Date().toISOString().slice(0,10));
  const days=parseInt(document.getElementById('days').value,10);
  const maxConsec=parseInt(document.getElementById('maxConsec').value,10);
  const map=schedule(employees,req,startDate,days,maxConsec);
  const htmlTable=buildTable(map,employees,startDate,days);
  document.getElementById('result').innerHTML=htmlTable;
});

// Prefill today's date
document.getElementById('startDate').value=new Date().toISOString().slice(0,10);
</script>
</body>
</html>
